<div class="admin-dashboard">
  <app-sidebar></app-sidebar>
  
  <div class="dashboard-container">
    <div class="chart-section">
      <h2>Category Distribution</h2>
      <div>
        <canvas
          baseChart
          [datasets]="pieChartData"
          [labels]="pieChartLabels"
          [options]="pieChartOptions"
          [legend]="pieChartLegend"
          [type]="pieChartType">
        </canvas>
      </div>
    </div>
  
    <div class="chart-section">
      <h2>Minimum Price Trends</h2>
      <div>
        <canvas
          baseChart
          [datasets]="lineChartData"
          [labels]="lineChartLabels"
          [options]="lineChartOptions"
          [legend]="lineChartLegend"
          [type]="lineChartType">
        </canvas>
      </div>
    </div>
  
    <div class="chart-section">
      <h2>Auctioneer Contributions</h2>
      <div>
        <canvas
          baseChart
          [datasets]="doughnutChartData"
          [labels]="doughnutChartLabels"
          [options]="doughnutChartOptions"
          [legend]="doughnutChartLegend"
          [type]="doughnutChartType">
        </canvas>
      </div>
    </div>
  
    <div class="chart-section">
      <h2>Active Listings</h2>
      <div>
        <canvas
          baseChart
          [datasets]="activeBarChartData"
          [labels]="activeBarChartLabels"
          [options]="activeBarChartOptions"
          [legend]="activeBarChartLegend"
          [type]="activeBarChartType">
        </canvas>
      </div>
    </div>
  </div>
</div>
